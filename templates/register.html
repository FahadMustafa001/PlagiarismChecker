{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4 animate-fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <div class="brand-logo-modern mb-3" style="width: 48px; height: 48px; border-radius: 12px; margin-right: 0;">
                <span class="logo-text-symbol" style="font-size: 1.5rem;">α</span>
            </div>
            <h3 class="fw-bold text-white mb-1" style="font-family: 'Space Grotesk', sans-serif;">Create Node Credentials</h3>
            <p class="text-muted small">Register a new access node to generate deep integrity reports.</p>
        </div>

        <div class="card border-0 p-4 rounded-4 tilt-3d" style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border) !important;">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white fw-medium small">Choose Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control shadow-none" placeholder=" " required autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white fw-medium small">Create Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" name="password" class="form-control shadow-none" placeholder=" " required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-dark w-100 py-2.5 fw-semibold shadow border-0 rounded-3 d-flex align-items-center justify-content-center gap-2" style="background: var(--accent-gradient);">
                    Create Credentials <i class="bi bi-shield-check fs-5"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small mb-0">
                Already registered? 
                <a href="/login" class="text-primary fw-semibold text-decoration-none hover-underline text-glow-primary">Sign in to console</a>
            </p>
        </div>
    </div>
</div>

<style>
    .hover-underline:hover {
        text-decoration: underline !important;
    }
</style>
{% endblock %}
