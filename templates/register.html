{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center py-4 animate-fade-in">
    <div class="col-md-6 col-lg-5">
        <div class="text-center mb-4">
            <div class="brand-logo-modern mb-3" style="width: 46px; height: 46px; border-radius: 12px; margin-right: 0;">
                <span class="logo-text-symbol" style="font-size: 1.4rem;">α</span>
            </div>
            <h3 class="fw-bold text-white mb-1" style="font-family: 'Space Grotesk', sans-serif;">Create Node Credentials</h3>
            <p class="text-muted small">Register a new access node to generate deep integrity reports.</p>
        </div>

        <div class="card p-4 hover-lift" style="background: rgba(13, 22, 41, 0.3) !important;">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white fw-medium small">Choose Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-muted" style="border-color: rgba(59, 130, 246, 0.25); border-right: none;"><i class="bi bi-person fs-5"></i></span>
                        <input type="text" name="username" class="form-control shadow-none" placeholder="Choose node name" required autocomplete="username" style="border-color: rgba(59, 130, 246, 0.25); border-left: none;">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-white fw-medium small">Create Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent text-muted" style="border-color: rgba(59, 130, 246, 0.25); border-right: none;"><i class="bi bi-shield-lock fs-5"></i></span>
                        <input type="password" name="password" class="form-control shadow-none" placeholder="Create strong password" required autocomplete="new-password" style="border-color: rgba(59, 130, 246, 0.25); border-left: none;">
                    </div>
                </div>

                <button type="submit" class="btn btn-light w-100 py-2.5 fw-bold border-0 rounded-3 d-flex align-items-center justify-content-center gap-2 hover-lift" style="background: linear-gradient(135deg, #f8fafc 0%, #cbd5e1 100%); color: #070b14; font-size: 0.95rem;">
                    Create Credentials <i class="bi bi-shield-check fs-5"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small mb-0">
                Already registered? 
                <a href="/login" class="text-primary fw-semibold text-decoration-none text-glow-primary ms-1">Sign in to console →</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
